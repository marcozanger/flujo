<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flujo - Connect to Google Sheets</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .phone-frame {
    width: 390px;
    height: 844px;
    background: #fff;
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .status-bar {
    height: 54px;
    background: #1a237e;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 28px 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    background: linear-gradient(180deg, #1a237e 0%, #283593 40%, #3949ab 100%);
  }
  .logo-container {
    margin-bottom: 48px;
    text-align: center;
  }
  .logo {
    width: 88px;
    height: 88px;
    background: #fff;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }
  .logo-text {
    font-size: 36px;
    font-weight: 800;
    color: #1a237e;
    letter-spacing: -1px;
  }
  .app-name {
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }
  .app-subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    margin-top: 8px;
  }
  .connect-section {
    width: 100%;
    margin-top: 16px;
  }
  .connect-section label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sheet-url-input {
    width: 100%;
    padding: 16px;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 15px;
    outline: none;
    margin-bottom: 24px;
  }
  .sheet-url-input::placeholder {
    color: rgba(255,255,255,0.4);
  }
  .btn-google {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #fff;
    color: #1a237e;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    transition: transform 0.15s;
  }
  .btn-google:hover {
    transform: scale(1.02);
  }
  .google-icon {
    width: 22px;
    height: 22px;
    background: conic-gradient(from -45deg, #ea4335, #4285f4, #34a853, #fbbc05, #ea4335);
    border-radius: 50%;
  }
  .divider {
    display: flex;
    align-items: center;
    margin: 28px 0;
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    width: 100%;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    border-top: 1px solid rgba(255,255,255,0.15);
  }
  .divider span { padding: 0 16px; }
  .btn-service-account {
    width: 100%;
    padding: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    background: transparent;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-service-account:hover {
    background: rgba(255,255,255,0.1);
  }
  .footer-text {
    margin-top: 40px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    text-align: center;
    line-height: 1.5;
  }
  .nav-links {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    background: rgba(0,0,0,0.2);
    padding: 12px 20px;
    display: flex;
    justify-content: center;
    gap: 8px;
    font-size: 11px;
  }
  .nav-links a {
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .nav-links a:hover { background: rgba(255,255,255,0.1); }
  .nav-links a.current { color: #fff; font-weight: 600; background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>GL</span>
  </div>
  <div class="content">
    <div class="logo-container">
      <div class="logo">
        <span class="logo-text">F</span>
      </div>
      <div class="app-name">Flujo</div>
      <div class="app-subtitle">Candidate Pipeline Manager</div>
    </div>
    <div class="connect-section">
      <label>Google Spreadsheet URL</label>
      <input class="sheet-url-input" type="text" placeholder="https://docs.google.com/spreadsheets/d/..." />
      <button class="btn-google">
        <div class="google-icon"></div>
        Sign in with Google
      </button>
      <div class="divider"><span>or</span></div>
      <button class="btn-service-account">
        Use Service Account (JSON key)
      </button>
    </div>
    <div class="footer-text">
      Global Logic Latin America<br>
      Hiring Pipeline Tool v1.0
    </div>
  </div>
  <div class="nav-links">
    <a href="01-login.html" class="current">Login</a>
    <a href="02-candidates.html">Candidates</a>
    <a href="03-candidate-detail.html">Detail</a>
    <a href="04-vacancies.html">Vacancies</a>
    <a href="05-resume-upload.html">Resume</a>
    <a href="06-email.html">Email</a>
  </div>
</div>
</body>
</html>
